<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>32Hour Cycle Journal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient"></div>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">32HourGroup</p>
      <h1>Cycle Journal</h1>
      <p class="subtext">Track your rhythm without pressure.</p>
    </section>

    <section class="surface note">
      <span class="label">Cycle Note</span>
      <p id="cycleNote"></p>
    </section>

    <section class="surface">
      <div class="section-header">
        <div>
          <span class="label">Quick Entry</span>
          <h2>Notice the cycle.</h2>
        </div>
      </div>

      <div class="grid">
        <div class="field">
          <label>Date</label>
          <input type="date" id="date">
        </div>

        <div class="field">
          <label>Current Rhythm</label>
          <select id="mood">
            <option>Grounded</option>
            <option>Balanced</option>
            <option>Rushed</option>
            <option>Fragmented</option>
            <option>Restless</option>
          </select>
        </div>
      </div>

      <div class="domains">
        <div class="domain">
          <span>Creation</span>
          <input type="range" min="0" max="5" value="3" id="creation">
        </div>

        <div class="domain">
          <span>Maintenance</span>
          <input type="range" min="0" max="5" value="3" id="maintenance">
        </div>

        <div class="domain">
          <span>Reflection</span>
          <input type="range" min="0" max="5" value="3" id="reflection">
        </div>

        <div class="domain">
          <span>Connection</span>
          <input type="range" min="0" max="5" value="3" id="connection">
        </div>

        <div class="domain">
          <span>Rest</span>
          <input type="range" min="0" max="5" value="3" id="rest">
        </div>
      </div>

      <div class="field">
        <label>What did you notice?</label>
        <textarea id="observation" placeholder="Patterns, wins, friction, urgency..."></textarea>
      </div>

      <div class="field">
        <label>What needs repair next cycle?</label>
        <textarea id="repair" placeholder="One small repair is enough."></textarea>
      </div>

      <div class="field">
        <label>ext cycle intention</label>
        <textarea id="intention" placeholder="What will you protect, release, or complete?"></textarea>
      </div>

      <button id="saveBtn">Save Cycle</button>
    </section>

    <section class="surface">
      <div class="section-header">
        <div>
          <span class="label">Archive</span>
          <h2>Past Cycles</h2>
        </div>
      </div>

      <div id="entries"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
